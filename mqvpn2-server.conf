[Interface]
Listen = 0.0.0.0:MQVPN2_PORT
Subnet = MQVPN2_SUBNET
TunName = mqvpn2
LogLevel = info

[TLS]
Cert = /etc/mqvpn2/server.crt
Key = /etc/mqvpn2/server.key

[Auth]
Key = MQVPN2_PASS
MaxClients = 64

[Multipath]
Scheduler = wlb
CC = cubic
InitMaxPathId = 128

[Reorder]
Enabled = off

[Hybrid]
Enabled = false
